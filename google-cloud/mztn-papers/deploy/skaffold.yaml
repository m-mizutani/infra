# Render and deploy configuration of the papers Cloud Deploy pipeline.
# cloudbuild.yaml fills in PAPERS_IMAGE before creating the release.
apiVersion: skaffold/v4beta7
kind: Config
metadata:
  name: papers
manifests:
  rawYaml:
    - service.yaml
deploy:
  cloudrun: {}
customActions:
  # Predeploy hook (cloud-deploy.tf): `papers firestore migrate` creates the
  # missing Firestore indexes and TTL policies the new version needs and waits
  # until the indexes are READY, so the new version takes traffic only once
  # they are usable. It is idempotent, so it runs on every release. The action keeps
  # its name so the pipeline in cloud-deploy.tf does not change.
  - name: firestore-setup
    containers:
      - name: firestore-setup
        image: PAPERS_IMAGE
        command: ["/papers"]
        args:
          - firestore
          - migrate
          - --firestore-project-id=mztn-papers
          - --firestore-database-id=papers
